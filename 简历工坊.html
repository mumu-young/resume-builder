<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历工坊</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/templates.css">
</head>
<body>
<div id="loading" class="loading">正在加载本地数据…</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">📄 简历工坊</span>
      <span class="divider"></span>
      <span id="resume-title" class="resume-title"></span>
      <select id="resume-select" class="resume-select" title="切换简历"></select>
    </div>
    <div class="topbar-right">
      <span id="wc-badge" class="wc-badge" title="当前简历总字数"></span>
      <span id="save-status" class="save-status"></span>
      <button id="btn-new" class="btn btn-ghost" data-action="new-resume">＋ 新建</button>
      <button id="btn-dup" class="btn btn-ghost" data-action="dup-resume">复制</button>
      <button id="btn-rename" class="btn btn-ghost" data-action="rename-resume">重命名</button>
      <button id="btn-del" class="btn btn-ghost danger" data-action="del-resume">删除</button>
      <button id="btn-toggle-preview" class="btn btn-ghost" data-action="toggle-preview">隐藏预览</button>
      <button id="btn-print" class="btn btn-primary" data-action="export-pdf">🖨️ 导出 PDF</button>
      <button id="btn-settings" class="btn btn-ghost" data-action="set-module" data-id="settings">⚙️ 设置</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="sidebar-label">功能模块</div>
      <nav id="module-nav" class="module-nav"></nav>
      <div class="sidebar-footer">
        <label class="switch" title="实时预览开关">
          <input type="checkbox" id="preview-switch" checked>
          <span class="switch-slider"></span>
          <span class="switch-text">实时预览</span>
        </label>
      </div>
    </aside>

    <main id="editor" class="editor-pane"></main>

    <aside id="preview-pane" class="preview-pane">
      <div class="preview-toolbar">
        <span>👁️ 实时预览（修改后自动更新）</span>
      </div>
      <div id="preview-scroll" class="preview-scroll">
        <div id="resume-page" class="resume-page"></div>
      </div>
    </aside>
  </div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="photo-file" accept="image/*" hidden>
<div id="rich-toolbar" class="rich-toolbar hidden">
  <button type="button" class="btn btn-primary" data-action="rich-bold"><b>B</b> 加粗</button>
  <button type="button" class="btn" data-action="rich-unbold">取消加粗</button>
</div>
<div id="pdf-preview" class="pdf-preview hidden">
  <div class="pdf-preview-bar">
    <span class="pdf-preview-title">PDF 预览</span>
    <span id="pdf-page-count" class="pdf-page-count">共 1 页</span>
    <span class="pdf-preview-spacer"></span>
    <span class="pdf-preview-tip">红色虚线为分页位置</span>
    <button type="button" class="btn" data-action="pdf-preview-close">取消</button>
    <button type="button" class="btn btn-primary" data-action="pdf-preview-save">保存 PDF</button>
  </div>
  <div id="pdf-preview-scroll" class="pdf-preview-scroll">
    <div id="pdf-preview-sheet" class="pdf-preview-sheet"></div>
  </div>
</div>
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title" class="modal-title"></h3>
    <p id="modal-msg" class="modal-msg"></p>
    <input id="modal-input" class="modal-input hidden" type="text">
    <div class="modal-actions">
      <button type="button" class="btn" data-action="modal-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="modal-ok" data-action="modal-ok">确定</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/templates.js"></script>
<script src="js/docx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
